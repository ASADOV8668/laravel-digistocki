<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-labelledby="title desc">
  <title id="title">تصویر پیش‌فرض آگهی موبایل</title>
  <desc id="desc">تصویر انتزاعی یک گوشی موبایل روی زمینه روشن</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#e8f0f5"/>
      <stop offset="1" stop-color="#cbd9e2"/>
    </linearGradient>
    <linearGradient id="phone" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#273f4b"/>
      <stop offset="1" stop-color="#17345c"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#17345c" flood-opacity=".2"/>
    </filter>
  </defs>
  <rect width="800" height="560" rx="34" fill="url(#bg)"/>
  <g transform="translate(335 92) rotate(-7 75 175)" filter="url(#shadow)">
    <rect width="150" height="350" rx="42" fill="url(#phone)"/>
    <circle cx="48" cy="55" r="22" fill="none" stroke="#a9b8bd" stroke-width="12"/>
    <circle cx="48" cy="55" r="7" fill="#a9b8bd"/>
    <rect x="57" y="316" width="36" height="5" rx="2.5" fill="#a9b8bd" opacity=".65"/>
  </g>
</svg>
