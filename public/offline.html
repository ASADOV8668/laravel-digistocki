<!doctype html>
<html lang="fa" dir="rtl">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="theme-color" content="#eb073f">
        <link rel="icon" type="image/x-icon" href="./favicon.ico">
        <title>اتصال برقرار نیست | دیجی استوکی</title>
        <style>
            :root { color-scheme: light; font-family: Vazirmatn, Tahoma, sans-serif; }
            * { box-sizing: border-box; }
            body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #f8fafc; color: #1c1a26; }
            main { width: min(100%, 420px); padding: 32px 24px; text-align: center; background: #fff; border-radius: 28px; box-shadow: 0 18px 50px rgba(28, 26, 38, .08); }
            img { width: 88px; height: 88px; border-radius: 24px; object-fit: cover; }
            h1 { margin: 24px 0 10px; font-size: 22px; }
            p { margin: 0; color: #64748b; font-size: 14px; line-height: 2; }
            button { margin-top: 24px; border: 0; border-radius: 14px; padding: 13px 22px; background: #eb073f; color: #fff; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer; }
            button:focus-visible { outline: 3px solid rgba(235, 7, 63, .25); outline-offset: 3px; }
        </style>
    </head>
    <body>
        <main>
            <img src="./images/logo-192.png" alt="دیجی استوکی">
            <h1>فعلاً اتصال برقرار نیست</h1>
            <p>اینترنت خود را بررسی کنید. بعد از برقراری اتصال، دوباره تلاش کنید.</p>
            <button type="button" onclick="window.location.reload()">تلاش دوباره</button>
        </main>
    </body>
</html>
